name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run validate:songs-json:raw

      - run: npm run typecheck:raw

      - run: npm run check:ts-emit:raw

      - run: npm run lint:raw

      - run: npm run test:unit:raw
