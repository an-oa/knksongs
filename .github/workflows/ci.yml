name: CI

# 単体テストなどの test job と、Chromium・WebKit の e2e job を並行して実行する。
# Deploy Pages はこのワークフローの完了を待つので、両方の job が成功した commit だけを公開する。
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # job 名の test は、main の ruleset（.github/rulesets/main.json）で必須の check にしている。変えるときは ruleset も直す。
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.1
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run validate:songs-json:raw

      - run: npm run typecheck:raw

      - run: npm run check:ts-emit:raw

      - run: npm run lint:raw

      - run: npm run test:unit:raw

  # job 名の e2e も、main の ruleset で必須の check にしている。変えるときは ruleset も直す。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.1
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps chromium webkit

      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
