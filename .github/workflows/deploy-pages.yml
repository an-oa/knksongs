name: Deploy Pages

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-pages
  queue: max

jobs:
  resolve:
    name: resolve
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deploy-sha: ${{ steps.target.outputs.deploy-sha }}
      is-current-main: ${{ steps.target.outputs.is-current-main }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false

      - name: Resolve deployment target
        id: target
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_main_sha="$(git rev-parse HEAD)"
          echo "deploy-sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          if [ "$DEPLOY_SHA" = "$current_main_sha" ]; then
            echo "is-current-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-current-main=false" >> "$GITHUB_OUTPUT"
            echo "Skip outdated deployment target: $DEPLOY_SHA (current main: $current_main_sha)"
          fi

  build:
    name: build
    needs: resolve
    if: needs.resolve.outputs.is-current-main == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve.outputs.deploy-sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0
          cache: npm

      - run: npm ci

      - name: Prepare Pages artifact
        env:
          DEPLOY_SHA: ${{ needs.resolve.outputs.deploy-sha }}
        run: npm run build:pages-artifact

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  freshness:
    name: freshness
    needs:
      - resolve
      - build
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.target.outputs.should-deploy }}

    steps:
      - name: Check deployment target is still main
        id: target
        env:
          DEPLOY_SHA: ${{ needs.resolve.outputs.deploy-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$DEPLOY_SHA" = "$current_main_sha" ]; then
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skip outdated deployment target: $DEPLOY_SHA (current main: $current_main_sha)"
          fi

  deploy:
    name: deploy
    needs:
      - resolve
      - build
      - freshness
    if: needs.freshness.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Verify deployment target after waiting
        env:
          DEPLOY_SHA: ${{ needs.resolve.outputs.deploy-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$DEPLOY_SHA" != "$current_main_sha" ]; then
            echo "Reject outdated deployment target: $DEPLOY_SHA (current main: $current_main_sha)"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    name: verify
    needs:
      - resolve
      - deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve.outputs.deploy-sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0

      - name: Verify deployed commit
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page-url }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.deploy-sha }}
        run: node scripts/verify-pages-deployment.mts

      - name: Verify deployed commit is still main
        env:
          DEPLOY_SHA: ${{ needs.resolve.outputs.deploy-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$DEPLOY_SHA" != "$current_main_sha" ]; then
            echo "Deployed commit is no longer current main: $DEPLOY_SHA (current main: $current_main_sha)"
            exit 1
          fi

  notify:
    name: notify
    needs:
      - resolve
      - build
      - freshness
      - deploy
      - verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write

    steps:
      # This trusted notification script uses only Node built-ins, without npm or build artifacts.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0

      - name: Update deployment failure issue
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          FRESHNESS_RESULT: ${{ needs.freshness.result }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: node scripts/deploy-pages-issue-notification.mts
