name: Update songs json

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6,18 * * *"

permissions:
  contents: read

concurrency:
  group: update-songs-json
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0
          cache: npm

      - run: npm ci

      - run: npm run build:songs-json

      - run: npm run validate:songs-json

      - name: Check generated songs json changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          tracked_paths_file="$RUNNER_TEMP/songs-update-tracked-paths"
          untracked_paths_file="$RUNNER_TEMP/songs-update-untracked-paths"
          git diff --name-only -z HEAD > "$tracked_paths_file"
          git ls-files --others --exclude-standard -z > "$untracked_paths_file"
          mapfile -d '' changed_paths < <(
            sort -zu "$tracked_paths_file" "$untracked_paths_file"
          )

          unexpected_paths=()
          for path in "${changed_paths[@]}"; do
            case "$path" in
              data/songs.json|data/songs-meta.json)
                ;;
              *)
                unexpected_paths+=("$path")
                ;;
            esac
          done

          if (( ${#unexpected_paths[@]} > 0 )); then
            printf 'Unexpected generated change: %s\n' "${unexpected_paths[@]}" >&2
            exit 1
          fi

          if (( ${#changed_paths[@]} == 0 )); then
            echo "No generated changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated songs json
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-songs-json
          path: |
            data/songs.json
            data/songs-meta.json
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-songs-json
          path: ${{ runner.temp }}/generated-songs-json

      - name: Check generated data and current main
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          generated_dir="$RUNNER_TEMP/generated-songs-json"
          mapfile -d '' generated_paths < <(find "$generated_dir" -mindepth 1 -maxdepth 1 -print0)
          if (( ${#generated_paths[@]} != 2 )); then
            echo "Expected exactly two generated JSON files" >&2
            exit 1
          fi
          for name in songs.json songs-meta.json; do
            if [[ ! -f "$generated_dir/$name" || -L "$generated_dir/$name" ]]; then
              echo "Expected a regular generated JSON file: $name" >&2
              exit 1
            fi
          done

          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$GITHUB_SHA" != "$current_main_sha" ]]; then
            echo "Skip outdated generated data: $GITHUB_SHA (current main: $current_main_sha)"
            echo "should-commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp -- "$generated_dir/songs.json" data/songs.json
          cp -- "$generated_dir/songs-meta.json" data/songs-meta.json
          echo "should-commit=true" >> "$GITHUB_OUTPUT"

      # App secrets are exposed only on a fresh runner that does not execute npm or artifact code.
      - name: Create GitHub App token
        id: app-token
        if: steps.target.outputs.should-commit == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit and push generated songs json
        if: steps.target.outputs.should-commit == 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          app_user_id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add -- data/songs.json data/songs-meta.json
          git commit -m "chore: update generated songs json" -m "- 公開CSVから songs.json と songs-meta.json を再生成した。"
          gh auth setup-git
          git push origin HEAD:main
