<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!--
  ogp.png（1200x630）の描画元。npm run render:brand-assets で書き出す。
  ?lang=en で開いたときは文字を英語に差し替え、英語の OGP 用の ogp-en.png として書き出す。
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  /*
   * 左はライトテーマのヘッダー（白地のホルスタイン柄）、右はダークテーマのヘッダー（赤いチェック柄）に揃え、
   * 両テーマの折衷にする。上下の帯と仕切りはダークのヘッダー下の線と同じ鐘の金色にする。
   */
  body {
    width: 1200px;
    height: 630px;
    font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
    background: #ffc928;
    color: #ffffff;
    position: relative;
    overflow: hidden;
  }
  .panel {
    position: absolute;
    top: 14px;
    bottom: 14px;
    left: 0;
    width: 400px;
    background: #fff;
    overflow: hidden;
    border-right: 6px solid #ffc928;
  }
  .panel .spots { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* ゴーグルは白い面の幅いっぱいに置き、バンドを面の左右の端まで届かせる。 */
  .panel .goggles {
    position: absolute;
    width: 100%;
    aspect-ratio: 1;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
  }
  /* styles.css のダークのヘッダーと同じチェック柄を、画像の大きさに合わせて約1.4倍にする。 */
  .wrap {
    position: absolute;
    top: 14px;
    bottom: 14px;
    left: 400px;
    right: 0;
    padding: 0 64px 0 72px;
    display: flex;
    flex-direction: column;
    /* タイトルと検索窓は左のゴーグルと同じ高さを中心に置く。 */
    justify-content: center;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 14px, transparent 14px 64px),
      repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 11px, transparent 11px 45px),
      repeating-linear-gradient(90deg, transparent 0 31px, rgba(255,255,255,.14) 31px 34px, transparent 34px 64px),
      repeating-linear-gradient(0deg, transparent 0 25px, rgba(255,201,40,.22) 25px 28px, transparent 28px 45px),
      #a61d1d;
  }
  /*
   * ヘッダーの文字ロゴと同じく「鐘輝かう」を大きく金色に、「歌サーチ」を小さく添える。
   * チェック柄の上の文字は、柄の明るい線と重なっても読めるよう影を付ける。
   */
  .title {
    margin: 0;
    display: flex;
    flex-direction: column;
    font-weight: 900;
  }
  .title .main {
    font-size: 100px;
    line-height: 1.1;
    letter-spacing: 0.02em;
    color: #ffc928;
    text-shadow: 0 2px 4px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.5);
  }
  .title .sub {
    margin-top: 4px;
    font-size: 52px;
    line-height: 1.2;
    letter-spacing: 0.12em;
    text-shadow: 0 2px 6px rgba(0,0,0,.7);
  }
  /* 画像は読ませずに見せるものなので、タグや説明文は置かない。検索窓はサイトと同じく例文入りで見せる。 */
  .search {
    margin-top: 40px;
    height: 78px;
    border-radius: 999px;
    background: #fff;
    box-shadow: 0 3px 10px rgba(0,0,0,.3);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 30px;
    font-size: 29px;
    color: #6b665c;
  }
  .search svg { width: 34px; height: 34px; flex: none; }
  /* 英語は欧文に合わせて字間だけ詰め、文字の大きさは日本語と同じにする。 */
  html[lang="en"] .title .main { letter-spacing: 0.01em; }
  html[lang="en"] .title .sub { letter-spacing: 0.06em; }
</style>
</head>
<body>
  <div class="panel">
    <svg class="spots" viewBox="0 0 400 602" preserveAspectRatio="none"><g fill="#1b1b1b">
      <path d="M-20 -20h170c10 34-12 58-46 66-34 9-46 40-84 36-22-2-24-40-40-102z"/>
      <path d="M300 40c30-14 80 0 110 30v120c-30 16-64 6-78-18-14-22-44-30-46-60-2-30-4-58 14-72z"/>
      <path d="M-20 400c34-18 76 0 90 30 14 30 0 70-18 104-14 26-40 60-72 80z"/>
      <path d="M270 470c26-22 74-18 92 10 12 18 10 46 0 70-6 16-14 40-24 64h-110c-8-48 4-112 42-144z"/>
      <path d="M150 290c10-8 26-6 30 4 4 9-4 20-16 22-12 2-20-14-14-26z"/>
    </g></svg>
    <img class="goggles" src="goggles.svg" alt="">
  </div>
  <div class="wrap">
    <h1 class="title"><span class="main">鐘輝かう</span><span class="sub">歌サーチ</span></h1>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <span class="search-placeholder">曲名・歌手・読み...</span>
    </div>
  </div>
  <script>
    // 英語の文字は app/lib/ui-text.mts のロゴと検索窓の文言と同じにする。
    if (new URLSearchParams(location.search).get("lang") === "en") {
      document.documentElement.lang = "en";
      document.querySelector(".title .main").textContent = "Kaneki Caw";
      document.querySelector(".title .sub").textContent = "Song Search";
      document.querySelector(".search-placeholder").textContent = "Song or artist...";
    }
  </script>
</body>
</html>
